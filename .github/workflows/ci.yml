name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Typecheck de todos los paquetes
        run: |
          for p in packages/*/ services/*/; do
            if [ -f "$p/tsconfig.json" ]; then
              echo "::group::typecheck $p"
              (cd "$p" && bunx tsc --noEmit)
              echo "::endgroup::"
            fi
          done

      # El motor de plazos tiene consecuencia legal directa: si sus tests fallan,
      # no se despliega nada (SPEC.md 7.4).
      - name: Tests
        run: bun test
