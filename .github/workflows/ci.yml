name: CI

on:
  push:
    branches: [main]
  pull_request:

# Solo un workflow por rama a la vez: si llega un push nuevo, cancela el anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck, lint, build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Typecheck de todos los paquetes
        run: |
          for p in packages/*/ services/*/; do
            if [ -f "$p/tsconfig.json" ]; then
              echo "::group::typecheck $p"
              (cd "$p" && bunx tsc --noEmit)
              echo "::endgroup::"
            fi
          done

      - name: Typecheck bff-web
        working-directory: apps/bff-web
        run: bunx tsc --noEmit

      - name: Lint bff-web
        working-directory: apps/bff-web
        run: bunx eslint .

      - name: Build bff-web
        working-directory: apps/bff-web
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
        run: bun run build

      # El motor de plazos tiene consecuencia legal directa: si sus tests fallan,
      # no se despliega nada (SPEC.md §7.4).
      - name: Tests
        run: bun run test

  # --- Despliegue (solo en push a main) -------------------------------------
  # Construye las dos imágenes, las sube a ECR y dispara el despliegue en la EC2
  # por SSM Run Command. Sin claves estáticas: asume el rol de AWS por OIDC
  # (infra/aws/iam.tf). Ver docs/deploy/CI-CD.md.
  build-and-push:
    name: Build y push a ECR
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC para asumir el rol de AWS
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configurar AWS credenciales por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag de imagen (SHA corto + latest)
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build+push bff-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/bff-web/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/sanciona-fleet/bff-web:${{ steps.tag.outputs.sha }}
            ${{ steps.ecr.outputs.registry }}/sanciona-fleet/bff-web:latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_SUPABASE_PROJECT_ID=${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Build+push deadlines-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/deadlines-service/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/sanciona-fleet/deadlines-service:${{ steps.tag.outputs.sha }}
            ${{ steps.ecr.outputs.registry }}/sanciona-fleet/deadlines-service:latest

    outputs:
      image_tag: ${{ steps.tag.outputs.sha }}

  deploy:
    name: Desplegar en EC2 (SSM Run Command)
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configurar AWS credenciales por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Ejecutar deploy-remote.sh en la EC2 por SSM
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
        run: |
          if [ -z "${INSTANCE_ID}" ]; then
            echo "Falta la variable del repo AWS_EC2_INSTANCE_ID (output de terraform)." >&2
            exit 1
          fi
          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${INSTANCE_ID}" \
            --parameters 'commands=["/opt/sanciona-fleet/scripts/deploy-remote.sh '"${IMAGE_TAG}"'"]' \
            --query 'Command.CommandId' --output text)
          echo "SSM CommandId: ${CMD_ID}"
          # Esperar a que termine (máx ~10 min).
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
              --query 'Status' --output text || echo "Unknown")
            echo "intentos ${i}: ${STATUS}"
            case "${STATUS}" in
              Success) echo "Deploy ok"; exit 0 ;;
              Failed|TimedOut|Cancelled) echo "Deploy fallido"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timeout esperando a SSM" >&2; exit 1
