name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck, lint, build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Typecheck de todos los paquetes
        run: |
          for p in packages/*/ services/*/; do
            if [ -f "$p/tsconfig.json" ]; then
              echo "::group::typecheck $p"
              (cd "$p" && bunx tsc --noEmit)
              echo "::endgroup::"
            fi
          done

      - name: Typecheck bff-web
        working-directory: apps/bff-web
        run: bunx tsc --noEmit

      - name: Lint bff-web
        working-directory: apps/bff-web
        run: bunx eslint .

      # Etapa 3: ningún archivo bajo src/features ni src/routes supera 250
      # líneas (criterio de salida del refactor de componentes).
      - name: Gate de 250 líneas (bff-web)
        working-directory: apps/bff-web
        run: bun run check:sizes

      - name: Build bff-web
        working-directory: apps/bff-web
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
        run: bun run build

      # El motor de plazos tiene consecuencia legal directa: si sus tests fallan,
      # no se despliega nada (SPEC.md §7.4).
      - name: Tests
        run: bun test
