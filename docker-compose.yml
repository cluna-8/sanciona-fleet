# Stack de prueba LOCAL de Sanciona Fleet. No es el de producción: bff-web corre
# en modo `vite dev` (Dockerfile.dev). El stack de producción es
# docker-compose.prod.yml (build Nitro node-server). Ver ADR 0003.
#
# Uso:
#   docker compose up --build
#   bff-web      -> http://localhost:8080
#   deadlines    -> http://localhost:8787
#
# Requiere apps/bff-web/.env con las credenciales de Supabase (ver
# apps/bff-web/.env.example). No se commitea y docker-compose lo lee vía
# env_file, igual que en desarrollo local sin Docker.

services:
  deadlines-service:
    build:
      context: .
      dockerfile: services/deadlines-service/Dockerfile
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  bff-web:
    build:
      context: .
      dockerfile: apps/bff-web/Dockerfile.dev
    ports:
      - "8080:8080"
    env_file:
      - apps/bff-web/.env
    environment:
      DEADLINES_SERVICE_URL: http://deadlines-service:8787
    depends_on:
      deadlines-service:
        condition: service_healthy
